[project]
name = "dbt-toolset"
version = "0.1.0"
description = "Compile a dbt project into a tool artifact and serve its models as query tools (AWS Lambda / MCP)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
# Build-time only: needed by `dbt-toolset compile`, never by the runtime.
compile = ["dbt-core>=1.8"]

[project.scripts]
dbt-toolset = "dbt_toolset.cli:main"

[dependency-groups]
dev = ["pytest>=8", "dbt-core>=1.8", "dbt-redshift>=1.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_toolset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
