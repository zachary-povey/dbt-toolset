[project]
name = "dbt-toolset"
version = "0.1.0"
description = "Compile a dbt project into a tool artifact and serve its models as query tools (AWS Lambda / MCP)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
# Build-time only: needed by `dbt-toolset compile`, never by the runtime.
# dbt needs the adapter named in the project's profile to parse it. Redshift is the only
# warehouse the runtime supports, so its adapter is included.
compile = ["dbt-core>=1.8", "dbt-redshift>=1.8", "pyyaml>=6"]
# Serving tools from an artifact. boto3 is preinstalled on Lambda but pinned here for containers.
runtime = ["sqlglot>=25", "boto3>=1.34"]
mcp = ["sqlglot>=25", "boto3>=1.34", "mcp>=2,<3"]
# Semantic-layer metric tools. Needed by both `compile` and the runtime when metrics are exposed.
# Pinned tightly: MetricFlow has no stable Python API.
metrics = ["metricflow>=0.213,<0.214"]

[project.scripts]
dbt-toolset = "dbt_toolset.cli:main"

[dependency-groups]
dev = ["pytest>=8", "dbt-core>=1.8", "dbt-redshift>=1.8", "pyyaml>=6", "sqlglot>=25", "boto3>=1.34", "mcp>=2,<3", "duckdb>=1", "metricflow>=0.213,<0.214"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_toolset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
